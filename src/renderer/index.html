<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>LanShare - 局域网文件共享</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">📡</span>
    <div>
      <div class="title">LanShare <span class="ver" id="ver"></span></div>
      <div class="subtitle">局域网文件共享工具</div>
    </div>
  </div>
  <div class="top-status">
    <span class="pill" id="portPill" title="点击可在「设置」中修改端口">端口 <b id="portText">-</b></span>
    <span class="pill" id="serverPill"><i class="dot off" id="serverDot"></i><span id="serverText">服务未启动</span></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="shares">共享管理</button>
  <button class="tab" data-tab="logs">访问日志</button>
  <button class="tab" data-tab="settings">设置</button>
</nav>

<main>

  <!-- ============ 共享管理 ============ -->
  <section id="tab-shares" class="tabpane">

    <div class="card" id="formCard">
      <div class="card-head">
        <h2 id="formTitle">新建共享</h2>
        <button class="btn ghost small" id="btnCancelEdit" hidden>取消编辑</button>
      </div>

      <div class="form-grid">
        <div class="field span2">
          <label>共享目录（可添加多个，多目录将各自显示为顶级文件夹）</label>
          <div id="rootList" class="root-list"></div>
          <button class="btn small" id="btnAddRoot">＋ 添加文件夹 / 磁盘</button>
        </div>

        <div class="field">
          <label for="fName">共享名称</label>
          <input id="fName" type="text" placeholder="例如：项目资料" maxlength="60">
        </div>

        <div class="field">
          <label>访问权限</label>
          <div class="radio-row">
            <label class="radio"><input type="radio" name="fRo" value="ro" checked> 只读（仅下载）</label>
            <label class="radio"><input type="radio" name="fRo" value="rw"> 读写（可上传/删除）</label>
          </div>
        </div>

        <div class="field">
          <label for="fPassword">访问密码（留空 = 无需密码）</label>
          <input id="fPassword" type="text" placeholder="留空表示无需密码" autocomplete="off">
        </div>

        <div class="field">
          <label for="fExpire">连接有效期</label>
          <select id="fExpire">
            <option value="0">永久有效</option>
            <option value="30">30 分钟</option>
            <option value="60">1 小时</option>
            <option value="360">6 小时</option>
            <option value="1440">1 天</option>
            <option value="4320">3 天</option>
            <option value="10080">7 天</option>
          </select>
        </div>

        <div class="field">
          <label for="fSpeed">限速（KB/s，0 = 不限）</label>
          <input id="fSpeed" type="number" min="0" step="64" value="0">
        </div>

        <div class="field">
          <label for="fConn">最大并发连接数（0 = 不限）</label>
          <input id="fConn" type="number" min="0" step="1" value="0">
        </div>

        <div class="field">
          <label for="fUploadMax">单个文件上传上限（MB，0 = 不限）</label>
          <input id="fUploadMax" type="number" min="0" step="100" value="0">
        </div>
      </div>

      <div class="form-actions">
        <button class="btn primary" id="btnSubmit">创建并启动共享</button>
        <button class="btn" id="btnReset">清空</button>
      </div>
    </div>

    <div id="shareList"></div>
  </section>

  <!-- ============ 访问日志 ============ -->
  <section id="tab-logs" class="tabpane" hidden>
    <div class="card">
      <div class="card-head">
        <h2>访问日志（最近 1000 条）</h2>
        <div class="row-actions">
          <button class="btn small" id="btnLogRefresh">刷新</button>
          <button class="btn small" id="btnLogExport">导出 JSON</button>
          <button class="btn small" id="btnLogOpen">打开日志目录</button>
          <button class="btn small danger" id="btnLogClear">清空显示</button>
        </div>
      </div>
      <div class="log-scroll">
        <table class="log-table">
          <thead>
            <tr><th style="width:150px">时间</th><th style="width:130px">共享</th><th style="width:130px">来源 IP</th><th style="width:90px">动作</th><th>详情</th></tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
        <div class="empty" id="logEmpty">暂无日志</div>
      </div>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section id="tab-settings" class="tabpane" hidden>
    <div class="card">
      <h2>服务设置</h2>
      <div class="form-grid">
        <div class="field">
          <label for="sPort">服务端口（重启共享后生效）</label>
          <div class="inline-row">
            <input id="sPort" type="number" min="1024" max="65535" value="8965">
            <button class="btn" id="btnSavePort">保存端口</button>
          </div>
          <p class="hint">所有共享使用同一端口，修改端口后需要重新启动正在运行的共享。</p>
        </div>

        <div class="field">
          <label class="check-row"><input type="checkbox" id="sAutoRestore"> 启动时自动恢复上次运行中的共享</label>
          <label class="check-row"><input type="checkbox" id="sLogToDisk"> 将访问日志写入磁盘（JSONL，按天分文件）</label>
          <label class="check-row"><input type="checkbox" id="sAutostart"> 开机自动启动 LanShare <span class="hint-inline" id="autostartHint"></span></label>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn primary" id="btnSaveSettings">保存设置</button>
      </div>
    </div>

    <div class="card">
      <h2>关于</h2>
      <p class="about-line">LanShare <span id="ver2"></span> — 免安装绿色版 / 安装版 双形态，Windows 与 macOS 可用。</p>
      <p class="about-line">仓库：<a href="#" id="repoLink">github.com/ajxdp/lan-share</a></p>
      <p class="about-line hint">绿色版开机自启依赖固定解压路径；安装版由安装器注册登录项，卸载时自动清理。</p>
    </div>
  </section>

</main>

<!-- ============ 二维码弹窗 ============ -->
<dialog id="qrDialog">
  <div class="qr-head">
    <h3 id="qrTitle">扫码访问</h3>
    <button class="btn ghost small" id="qrClose">✕</button>
  </div>
  <div class="qr-body">
    <div class="qr-ips" id="qrIps"></div>
    <img id="qrImg" alt="二维码" width="240" height="240">
    <div class="qr-url-row">
      <input id="qrUrl" readonly>
      <button class="btn small" id="qrCopy">复制链接</button>
    </div>
    <p class="hint">请确保手机与这台电脑处于同一局域网，然后用相机 / 微信扫码访问。</p>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
